# Option for serving the frontend from EC2 behind the ALB.
server {
  listen 80;
  root /var/www/ipl;  # contents of dist/
  index index.html;

  location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
  location /api/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /ws/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
